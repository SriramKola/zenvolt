<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Now - ZENVO⚡T</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
     <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ZENVO⚡T</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="stations.html">Stations</a></li>
                    <li class="nav-item"><a class="nav-link active" href="booking.html">Book Now</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="py-5 bg-light">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3">Book Your Charging Slot</h1>
            <p class="lead">Reserve your EV charging station in advance</p>
        </div>
    </section>

    <!-- Booking Section -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="booking-form bg-white p-4 rounded shadow">
                        <form id="bookingForm">
                            <!-- Service Type Selection -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">Service Type</label>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <div class="service-card" onclick="selectServiceType('self')">
                                            <input type="radio" name="serviceType" value="self" id="selfService" required>
                                            <label for="selfService" class="service-label">
                                                <div class="service-icon">
                                                    <i class="fas fa-user-check fa-2x text-primary"></i>
                                                </div>
                                                <h5>Self Service</h5>
                                                <p class="text-muted">Drive to station and charge yourself</p>
                                                <div class="service-price">No extra charges</div>
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="service-card" onclick="selectServiceType('pickup')">
                                            <input type="radio" name="serviceType" value="pickup" id="pickupService" required>
                                            <label for="pickupService" class="service-label">
                                                <div class="service-icon">
                                                    <i class="fas fa-car-side fa-2x text-success"></i>
                                                </div>
                                                <h5>Pickup & Drop</h5>
                                                <p class="text-muted">We pick up, charge & return your vehicle</p>
                                                <div class="service-price">+₹200 service fee</div>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Select Station</label>
                                    <select class="form-select" id="stationSelect" required>
                                        <option value="">Choose a station...</option>
                                        <option value="1">City Mall Charging Hub</option>
                                        <option value="2">Tech Park Station</option>
                                        <option value="3">Airport Express Hub</option>
                                        <option value="4">Metro Station Point</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Charging Type</label>
                                    <select class="form-select" id="chargingType" required>
                                        <option value="">Select charging type...</option>
                                        <option value="fast">Fast Charging (DC)</option>
                                        <option value="standard">Standard Charging (AC)</option>
                                        <option value="rapid">Rapid Charging</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Date & Time</label>
                                    <input type="datetime-local" class="form-control" id="bookingTime" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Duration (hours)</label>
                                    <select class="form-select" id="duration" required>
                                        <option value="1">1 hour - ₹50</option>
                                        <option value="2">2 hours - ₹90</option>
                                        <option value="3">3 hours - ₹130</option>
                                        <option value="4">4 hours - ₹160</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Vehicle Model</label>
                                    <input type="text" class="form-control" id="vehicleModel" placeholder="e.g., Tesla Model 3" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phoneNumber" placeholder="+91 9876543210" required>
                                </div>
                            </div>
                            <!-- Pickup Service Fields -->
                            <div id="pickupFields" style="display: none;">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Pickup Address</label>
                                        <input type="text" class="form-control" id="pickupAddress" placeholder="Enter your address">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Pickup Time</label>
                                        <input type="datetime-local" class="form-control" id="pickupTime">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Keys Location</label>
                                    <select class="form-select" id="keysLocation">
                                        <option value="">Where should we collect keys?</option>
                                        <option value="security">Security Guard</option>
                                        <option value="reception">Reception Desk</option>
                                        <option value="personal">Personal Handover</option>
                                        <option value="lockbox">Key Lockbox</option>
                                    </select>
                                </div>
                            </div>
                            
                            <!-- Pricing Summary -->
                            <div class="pricing-summary mb-4">
                                <div class="row">
                                    <div class="col-6">
                                        <span>Charging Cost:</span>
                                    </div>
                                    <div class="col-6 text-end">
                                        <span id="chargingCost">₹0</span>
                                    </div>
                                </div>
                                <div class="row" id="serviceFeeRow" style="display: none;">
                                    <div class="col-6">
                                        <span>Service Fee:</span>
                                    </div>
                                    <div class="col-6 text-end">
                                        <span>₹200</span>
                                    </div>
                                </div>
                                <hr>
                                <div class="row fw-bold">
                                    <div class="col-6">
                                        <span>Total Amount:</span>
                                    </div>
                                    <div class="col-6 text-end">
                                        <span id="totalAmount">₹0</span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Special Requirements (Optional)</label>
                                <textarea class="form-control" id="specialRequirements" rows="3" placeholder="Any special requirements or notes..."></textarea>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-calendar-check"></i> <span id="bookingButtonText">Confirm Booking</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2025 ZENVO⚡T. All rights reserved.</p>
        </div>
    </footer>

    <style>
        .service-card {
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
        }
        
        .service-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }
        
        .service-card.selected {
            border-color: #0d6efd;
            background-color: #f8f9ff;
        }
        
        .service-label {
            cursor: pointer;
            margin: 0;
        }
        
        .service-icon {
            margin-bottom: 1rem;
        }
        
        .service-price {
            font-weight: 600;
            color: #198754;
        }
        
        .pricing-summary {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        
        input[type="radio"] {
            display: none;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check authentication after page loads
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('zenvo_user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                if (!userData.isLoggedIn) {
                    window.location.href = 'login.html';
                    return;
                }
            } catch (e) {
                localStorage.removeItem('zenvo_user');
                window.location.href = 'login.html';
                return;
            }
            
            // Set minimum date/time to current time
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30);
            const minDateTime = now.toISOString().slice(0, 16);
            document.getElementById('bookingTime').min = minDateTime;
            document.getElementById('bookingTime').value = minDateTime;
        });
        
        function logout() {
            localStorage.removeItem('zenvo_user');
            localStorage.removeItem('zenvo_remember');
            window.location.href = 'login.html';
        }



        // Service type selection
        function selectServiceType(type) {
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            const selectedCard = document.querySelector(`#${type}Service`).closest('.service-card');
            selectedCard.classList.add('selected');
            
            const pickupFields = document.getElementById('pickupFields');
            const serviceFeeRow = document.getElementById('serviceFeeRow');
            const bookingButtonText = document.getElementById('bookingButtonText');
            
            if (type === 'pickup') {
                pickupFields.style.display = 'block';
                serviceFeeRow.style.display = 'flex';
                bookingButtonText.textContent = 'Book Pickup & Drop Service';
                
                // Make pickup fields required
                document.getElementById('pickupAddress').required = true;
                document.getElementById('pickupTime').required = true;
                document.getElementById('keysLocation').required = true;
            } else {
                pickupFields.style.display = 'none';
                serviceFeeRow.style.display = 'none';
                bookingButtonText.textContent = 'Confirm Booking';
                
                // Remove required attribute from pickup fields
                document.getElementById('pickupAddress').required = false;
                document.getElementById('pickupTime').required = false;
                document.getElementById('keysLocation').required = false;
            }
            
            updatePricing();
        }
        
        // Update pricing
        function updatePricing() {
            const duration = document.getElementById('duration').value;
            const serviceType = document.querySelector('input[name="serviceType"]:checked')?.value;
            
            if (!duration) return;
            
            const chargingCost = parseInt(duration) * 50; // ₹50 per hour
            const serviceFee = serviceType === 'pickup' ? 200 : 0;
            const totalAmount = chargingCost + serviceFee;
            
            document.getElementById('chargingCost').textContent = `₹${chargingCost}`;
            document.getElementById('totalAmount').textContent = `₹${totalAmount}`;
        }
        
        // Add event listeners
        document.getElementById('duration').addEventListener('change', updatePricing);
        
        // Handle form submission
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const serviceType = document.querySelector('input[name="serviceType"]:checked')?.value;
            
            if (!serviceType) {
                alert('Please select a service type');
                return;
            }
            
            const formData = {
                serviceType: serviceType,
                station: document.getElementById('stationSelect').value,
                chargingType: document.getElementById('chargingType').value,
                bookingTime: document.getElementById('bookingTime').value,
                duration: document.getElementById('duration').value,
                vehicleModel: document.getElementById('vehicleModel').value,
                phoneNumber: document.getElementById('phoneNumber').value,
                specialRequirements: document.getElementById('specialRequirements').value
            };
            
            // Additional validation for pickup service
            if (serviceType === 'pickup') {
                formData.pickupAddress = document.getElementById('pickupAddress').value;
                formData.pickupTime = document.getElementById('pickupTime').value;
                formData.keysLocation = document.getElementById('keysLocation').value;
                
                if (!formData.pickupAddress || !formData.pickupTime || !formData.keysLocation) {
                    alert('Please fill in all pickup service fields');
                    return;
                }
            }

            if (!formData.station || !formData.chargingType || !formData.bookingTime || !formData.duration || !formData.vehicleModel || !formData.phoneNumber) {
                alert('Please fill in all required fields');
                return;
            }
            
            // Show success message based on service type
            const message = serviceType === 'pickup' ? 
                'Pickup & Drop service booked! We will contact you 30 minutes before pickup.' :
                'Booking confirmed! You will receive a confirmation SMS shortly.';
            
            alert(message);
            
            // Reset form
            this.reset();
            document.querySelectorAll('.service-card').forEach(card => {
                card.classList.remove('selected');
            });
            document.getElementById('pickupFields').style.display = 'none';
            document.getElementById('serviceFeeRow').style.display = 'none';
            
            // Set minimum date/time again
            const now = new Date();
            now.setMinutes(now.getMinutes() + 30);
            const minDateTime = now.toISOString().slice(0, 16);
            document.getElementById('bookingTime').min = minDateTime;
            document.getElementById('bookingTime').value = minDateTime;
        });
    </script>
</body>
</html>
