<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZENVO⚡T</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-7">
                    <div class="login-card glass texture-overlay">
                        <div class="text-center mb-4">
                            <h1 class="login-brand">ZENVO⚡T</h1>
                            <p class="text-muted">Welcome back to the future of EV charging</p>
                        </div>

                        <!-- Alert Box -->
                        <div id="alertBox" class="alert d-none mb-3" role="alert"></div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="toggleBtn">
                                        <i class="fas fa-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none">Forgot password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-3" id="loginBtn">
                                <i class="fas fa-sign-in-alt"></i> Sign In
                            </button>
                        </form>

                        <div class="text-center mb-3">
                            <p class="text-muted">Or continue with</p>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-danger flex-fill" onclick="googleLogin()">
                                    <i class="fab fa-google"></i> Google
                                </button>
                                <button class="btn btn-outline-primary flex-fill" onclick="facebookLogin()">
                                    <i class="fab fa-facebook"></i> Facebook
                                </button>
                            </div>
                        </div>

                        <div class="text-center">
                            <p class="text-muted">Don't have an account? 
                                <a href="#" class="text-decoration-none fw-bold" data-bs-toggle="modal" data-bs-target="#signupModal">Sign up</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div class="modal fade" id="signupModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Create Account</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body px-4">
                    <div id="signupAlert" class="alert d-none mb-3" role="alert"></div>
                    <form id="signupForm">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" id="signupName" placeholder="Enter your full name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="signupEmail" placeholder="Enter your email" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                <input type="tel" class="form-control" id="signupPhone" placeholder="+91 9876543210" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="signupPassword" placeholder="Min 6 characters" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="signupConfirm" placeholder="Re-enter password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="signupBtn">
                            <i class="fas fa-user-plus"></i> Create Account
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Toggle password visibility
        document.getElementById('toggleBtn').addEventListener('click', function () {
            const password = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                password.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        });

        function showAlert(id, message, type = 'danger') {
            const box = document.getElementById(id);
            box.className = `alert alert-${type}`;
            box.textContent = message;
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            btn.disabled = true;

            const res = await api.login({ email, password });

            if (res.token) {
                localStorage.setItem('zenvo_token', res.token);
                localStorage.setItem('zenvo_user', JSON.stringify({ ...res.user, isLoggedIn: true }));
                if (rememberMe) localStorage.setItem('zenvo_remember', email);
                window.location.href = 'index.html';
            } else {
                btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                btn.disabled = false;
                showAlert('alertBox', res.message || 'Invalid email or password');
            }
        });

        // Signup
        document.getElementById('signupForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const phone = document.getElementById('signupPhone').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            if (password !== confirm) {
                showAlert('signupAlert', 'Passwords do not match');
                return;
            }
            if (password.length < 6) {
                showAlert('signupAlert', 'Password must be at least 6 characters');
                return;
            }

            const btn = document.getElementById('signupBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating Account...';
            btn.disabled = true;

            const res = await api.register({ name, email, password, phone });

            if (res.token) {
                localStorage.setItem('zenvo_token', res.token);
                localStorage.setItem('zenvo_user', JSON.stringify({ ...res.user, isLoggedIn: true }));
                window.location.href = 'index.html';
            } else {
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                btn.disabled = false;
                showAlert('signupAlert', res.message || 'Registration failed');
            }
        });

        // Google Login
        function googleLogin() {
            window.location.href = 'https://zenvolt-qh50.onrender.com/api/auth/google';
        }

        // Facebook Login
        function facebookLogin() {
            alert('Facebook login coming soon!');
        }

        // Remember me
        window.addEventListener('load', function () {
            const rememberedEmail = localStorage.getItem('zenvo_remember');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }

            // Handle Google OAuth callback
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                localStorage.setItem('zenvo_token', token);
                localStorage.setItem('zenvo_user', JSON.stringify({
                    id: params.get('id'),
                    name: params.get('name'),
                    email: params.get('email'),
                    isLoggedIn: true
                }));
                window.location.href = 'index.html';
            }
            const error = params.get('error');
            if (error) showAlert('alertBox', 'Google login failed. Please try again.');
        });
    </script>
</body>
</html>
