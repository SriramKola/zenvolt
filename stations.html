<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stations - ZENVO⚡T</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">ZENVO⚡T</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="stations.html">Stations</a></li>
                    <li class="nav-item"><a class="nav-link" href="booking.html">Book Now</a></li>
                    <li class="nav-item"><a class="nav-link" href="profile.html">Profile</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <section class="py-5 bg-light">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-3">Charging Stations</h1>
            <p class="lead">Find and explore nearby EV charging stations</p>
            <button class="btn btn-primary" onclick="findNearbyStations()">
                <i class="fas fa-location-arrow"></i> Find Nearby Stations
            </button>
        </div>
    </section>

    <!-- Map Section -->
    <section class="py-5">
        <div class="container">
            <div class="row">
                <div class="col-lg-8">
                    <div id="map" class="map-container"></div>
                </div>
                <div class="col-lg-4">
                    <div class="station-list">
                        <h5>Available Stations</h5>
                        <div class="mb-3">
                            <input type="text" class="form-control" id="searchStations" placeholder="Search stations...">
                        </div>
                        <div id="stationsList" class="list-group">
                            <!-- Stations will be populated by JS -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container text-center">
            <p>&copy; 2025 ZENVO⚡T. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Check authentication after page loads
        document.addEventListener('DOMContentLoaded', function() {
            const user = localStorage.getItem('zenvo_user');
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            try {
                const userData = JSON.parse(user);
                if (!userData.isLoggedIn) {
                    window.location.href = 'login.html';
                    return;
                }
            } catch (e) {
                localStorage.removeItem('zenvo_user');
                window.location.href = 'login.html';
                return;
            }
        });
        
        function logout() {
            localStorage.removeItem('zenvo_user');
            localStorage.removeItem('zenvo_remember');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
