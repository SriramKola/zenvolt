<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZENVO⚡T</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-7">
                    <div class="login-card glass texture-overlay">
                        <div class="text-center mb-4">
                            <h1 class="login-brand">ZENVO⚡T</h1>
                            <p class="text-muted">Welcome back to the future of EV charging</p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                                    <button class="btn btn-outline-secondary" type="button" id="toggleBtn">
                                        <i class="fas fa-eye" id="toggleIcon"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-decoration-none">Forgot password?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mb-3">
                                <i class="fas fa-sign-in-alt"></i> Sign In
                            </button>
                        </form>
                        <div class="text-center mb-3">
                            <p class="text-muted">Or continue with</p>
                            <div class="d-flex gap-2">
                                <button class="btn btn-outline-danger flex-fill" onclick="socialLogin('google')">
                                    <i class="fab fa-google"></i> Google
                                </button>
                                <button class="btn btn-outline-primary flex-fill" onclick="socialLogin('facebook')">
                                    <i class="fab fa-facebook"></i> Facebook
                                </button>
                            </div>
                        </div>
                        <div class="text-center">
                            <p class="text-muted">Don't have an account? <a href="#" class="text-decoration-none">Sign up</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.getElementById('toggleBtn').addEventListener('click', function() {
            const password = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (password.type === 'password') {
                password.type = 'text';
                toggleIcon.className = 'fas fa-eye-slash';
            } else {
                password.type = 'password';
                toggleIcon.className = 'fas fa-eye';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';
            submitBtn.disabled = true;

            const res = await api.login({ email, password });

            if (res.token) {
                localStorage.setItem('zenvo_token', res.token);
                localStorage.setItem('zenvo_user', JSON.stringify({ ...res.user, isLoggedIn: true }));
                if (rememberMe) localStorage.setItem('zenvo_remember', email);
                window.location.href = 'index.html';
            } else {
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                submitBtn.disabled = false;
                alert(res.message || 'Login failed');
            }
        });

        // Sign up link handler
        document.querySelector('a[href="#"]').addEventListener('click', async function(e) {
            e.preventDefault();
            const name = prompt('Enter your name:');
            const email = prompt('Enter your email:');
            const password = prompt('Enter your password (min 6 chars):');
            const phone = prompt('Enter your phone number:');
            if (!name || !email || !password) return;
            const res = await api.register({ name, email, password, phone });
            if (res.token) {
                localStorage.setItem('zenvo_token', res.token);
                localStorage.setItem('zenvo_user', JSON.stringify({ ...res.user, isLoggedIn: true }));
                window.location.href = 'index.html';
            } else {
                alert(res.message || 'Registration failed');
            }
        });

        function socialLogin(provider) {
            alert(`${provider.charAt(0).toUpperCase() + provider.slice(1)} login would be implemented here`);
        }

        window.addEventListener('load', function() {
            const rememberedEmail = localStorage.getItem('zenvo_remember');
            if (rememberedEmail) {
                document.getElementById('email').value = rememberedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>
</body>
</html>
